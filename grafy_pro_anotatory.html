ne comprends rien , dit Marie-Anne , en ** essayant ** , sans se lever , de taper sur le ventre de son père , l' interprète principal est tellement beau .<br />src.lang: cs<br />form.fr: ger","dimension1:  0.2602229821<br />dimension2: -0.4576896358<br />ID_occurrence:  21<br />En se ** tournant ** successivement vers tous ses visages reflétés , il dit d' une voix faible et suraiguë de vieille dame :<br />src.lang: cs<br />form.fr: ger","dimension1: -0.2590676774<br />dimension2: -0.0753631521<br />ID_occurrence:  29<br />Elle le regardait en ** souriant ** , comme si elle savait qu' il allait venir .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.2465588187<br />dimension2: -0.0072959073<br />ID_occurrence:  34<br />Il y avait là-dedans des phrases sur l' amour de l' Union soviétique et sur la fidélité au parti communiste , il y avait une condamnation des intellectuels qui , était -il écrit , voulaient conduire le pays à la guerre civile , mais surtout , il y avait une dénonciation de la rédaction de l' hebdomadaire des écrivains avec le nom du journaliste à la haute silhouette voûtée ( Tomas ne l' avait jamais rencontré mais connaissait son nom et sa photo ) qui l' avait délibérément abusé en ** déformant ** le sens de son article pour en faire un appel contre-révolutionnaire ;<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1649270315<br />dimension2: -0.2323149915<br />ID_occurrence:  38<br />Il a le verbe haut , il plaisante en ** levant ** tour à tour chaque genou , pour bien convaincre les deux sœurs de son enjouement de tonton , toujours prêt à se transformer en cheval de course pour le plaisir de ses petites nièces .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.4013990717<br />dimension2: -0.0741390336<br />ID_occurrence:  44<br />La larme dans l' œil de Laura était celle de l' émotion que suscitait chez Laura la vue d' une Laura décidée à faire le sacrifice de sa vie , en ** restant ** aux côtés du mari de sa sœur disparue .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1379179520<br />dimension2: -0.1372232131<br />ID_occurrence:  57<br />En le ** voyant ** , elle lui sourit comme à un ami :<br />src.lang: cs<br />form.fr: ger","dimension1: -0.4193392220<br />dimension2: -0.0889198744<br />ID_occurrence:  65<br />Curieusement , l' ami des femmes et du prolétariat , le messager de l' égalité et de la fraternité , ne manifeste aucune émotion à l' idée que Christiane était une ancienne ouvrière et que Goethe avait fait preuve d' un courage hors du commun en ** vivant ** ouvertement avec elle , puis en l' épousant .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1465013484<br />dimension2: -0.1234447405<br />ID_occurrence:  68<br />Sans ça , je suis une morte , tout en ** vivant ** .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1622815863<br />dimension2: -0.1275717874<br />ID_occurrence:  85<br />Ils promirent d' offrir à la station beaucoup de contrats publicitaires et de lancer une grande campagne , avec des affiches dans tout Paris , mais en posant des conditions auxquelles le directeur des programmes , connu sous le sobriquet de Grizzly , ne pouvait que se soumettre : peu à peu , il entreprit de raccourcir tous les commentaires , pour éviter d' ennuyer l' auditeur par de longues réflexions ; il laissa interrompre le discours des rédacteurs par les questions d' autres.rédacteurs , transformant ainsi le monologue en conversation ; il multiplia les intermèdes musicaux , au point même de garder souvent une musique de fond sous les paroles , et il recommanda à tous ses collaborateurs de donner à tout ce qu' ils diraient au micro une légèreté décontractée , jeune et insouciante , celle -là même qui a tant embelli mes rêves du petit matin en ** faisant ** de la météo une manière d' opéra-bouffe .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.4183689904<br />dimension2: -0.0967420281<br />ID_occurrence:  88<br />La vie se moquait de moi en m' ** envoyant ** le rappel de mon échec , précisément sous les traits de la maîtresse de cet homme que j' avais cru vaincre la veille dans une grotesque lutte sexuelle .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1615731200<br />dimension2: -0.2413199025<br />ID_occurrence:  92<br />Plus que Goethe buvant du vin en douce , c' est Bettina qui me paraît intéressante : elle ne s' est pas comportée comme vous ou moi , qui aurions observé Goethe avec amusement , mais en nous ** taisant ** discrètement et respectueusement .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1628315338<br />dimension2: -0.2526763193<br />ID_occurrence:  97<br />Ah , ce cher Paul qui voulait provoquer Grizzly et le faire enrager , en ** tirant ** un trait sur l' Histoire , sur Beethoven , sur Picasso …<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1654031649<br />dimension2: -0.0709626981<br />ID_occurrence: 107<br />Le lendemain , en ** revenant ** à Prague après l' enterrement , elle reçut un télégramme : son père s' était suicidé de chagrin .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1484308465<br />dimension2: -0.0961709271<br />ID_occurrence: 131<br />C' est alors que tout alla de travers : il se réveilla avec la migraine , le facteur lui apporta deux lettres désagréables , en ** téléphonant ** à un bureau il dut subir la voix impatiente d' une femme qui refusait de comprendre sa demande .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.3928255792<br />dimension2: -0.0605748683<br />ID_occurrence: 134<br />Quelques instants plus tôt , en ** voyant ** sa siamoise réagir si violemment à l' attitude distraite de Bernard , elle s' était soudain sentie solidaire de l' animal :<br />src.lang: cs<br />form.fr: ger","dimension1: -0.4044220914<br />dimension2: -0.0795757518<br />ID_occurrence: 145<br />Il lui dit qu' il n' habitait pas loin , qu' il était ingénieur et que la dernière fois il s' était arrêté tout à fait par hasard en ** rentrant ** de son travail .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.3340688782<br />dimension2: -0.0424101893<br />ID_occurrence: 147<br />Comment je me suis d' abord attachée à Pavel , je ne pourrais le dire aujourd'hui à personne , c' est comme de la mauvaise littérature , un jour anniversaire de la Libération il y avait un grand meeting sur la place de la Vieille-Ville , notre Ensemble était lui aussi de la fête , nous allions partout en groupe , petite cohorte parmi des dizaines de milliers de gens , sur la tribune nos hommes d' État et aussi des étrangers , beaucoup de discours et beaucoup d' ovations , puis Togliatti à son tour s' est approché du micro pour une brève allocution en italien et , comme toujours , la place a répondu en criant , en battant des mains , en ** scandant ** des mots d' ordre .<br />src.lang: cs<br />form.fr: ger","dimension1:  0.0045423721<br />dimension2: -0.4063477866<br />ID_occurrence: 156<br />Mais en ** voyant ** la photo géante à chaque coin de rue , Laura l' avait mise en relation avec la nouvelle attitude de son amant , avec ses silences , avec son air distrait , et en avait conclu sans hésiter que le succès avait envoyé sur son chemin une autre femme qui occupait toutes ses pensées .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1755511324<br />dimension2:  0.0545526867<br />ID_occurrence: 157<br />En ** envahissant ** les rues , les voitures ont réduit les trottoirs , où s' entassent les passants .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1183393704<br />dimension2: -0.1157423936<br />ID_occurrence: 159<br />II prononça ces derniers mots avec une certaine gravité , puis ajouta en ** souriant ** :<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1503252208<br />dimension2: -0.1437912109<br />ID_occurrence: 164<br />Elle ne pouvait trouver la consolation qu' en ** regardant ** en arrière .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.3603026005<br />dimension2: -0.0594426224<br />ID_occurrence: 180<br />En s' ** attardant ** dans la salle des Hollandais , Rubens songeait à la luthiste et se disait : la luthiste n' est pas un modèle pour Frans Hais ; la luthiste est le modèle des grands peintres d' autrefois , qui cherchaient la beauté dans la surface immobile du visage .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1205179649<br />dimension2: -0.0679433721<br />ID_occurrence: 194<br />Il se morigénait , s' intimait l' ordre de ne pas céder à la compassion et la compassion l' écoutait en ** baissant ** la tête comme un coupable .<br />src.lang: cs<br />form.fr: ger","dimension1:  0.1212880726<br />dimension2: -0.4375070892<br />ID_occurrence: 197<br />La femme qui tenait de la girafe et de la cigogne souriait en ** clignant ** des yeux et tout ce qu' elle disait semblait imprégné d' un sens ou d' une ironie cachés .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.2759910593<br />dimension2: -0.0780725646<br />ID_occurrence: 202<br />Son âme voulait ainsi montrer que , tout en ** désapprouvant ** ce qui était en train de se produire , elle avait choisi de rester neutre .<br />src.lang: cs<br />form.fr: ger","dimension1:  0.0149031226<br />dimension2: -0.4167538563<br />ID_occurrence: 214<br />de fait , il y avait une pompe devant l' entrée , et la grosse quadragénaire , sans doute flattée du titre décerné à son fils , riait en ** donnant ** un billet au cavalier ( quêteur ) qui quémandait :<br />src.lang: cs<br />form.fr: ger","dimension1: -0.0503105244<br />dimension2: -0.3786409769<br />ID_occurrence: 219<br />Elle les essuya en ** disant ** :<br />src.lang: cs<br />form.fr: ger","dimension1: -0.2599904885<br />dimension2:  0.0036101272<br />ID_occurrence: 242<br />En ** arrivant ** au Mont-de-Pierre , cette colline verdoyante qui se dresse au centre de Prague , elle s' aperçut avec stupeur qu' il n' y avait personne .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.3131538709<br />dimension2: -0.0797501773<br />ID_occurrence: 243<br />Je le dirai autrement : son amour pour la belle le ramena à l' état de puceau ; car en ** prononçant ** le mot « amour » , comme je l' ai dit en une autre occasion , tout Européen retourne , sur les ailes de l' enchantement , à l' état pré-coïtal ( ou extra-coïtal ) , à l' endroit où avait souffert le jeune Werther et où Dominique , dans le roman de Fromentin , avait failli tomber de cheval .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.2417602228<br />dimension2: -0.0492638941<br />ID_occurrence: 245<br />Comment je me suis d' abord attachée à Pavel , je ne pourrais le dire aujourd'hui à personne , c' est comme de la mauvaise littérature , un jour anniversaire de la Libération il y avait un grand meeting sur la place de la Vieille-Ville , notre Ensemble était lui aussi de la fête , nous allions partout en groupe , petite cohorte parmi des dizaines de milliers de gens , sur la tribune nos hommes d' État et aussi des étrangers , beaucoup de discours et beaucoup d' ovations , puis Togliatti à son tour s' est approché du micro pour une brève allocution en italien et , comme toujours , la place a répondu en ** criant ** , en battant des mains , en scandant des mots d' ordre .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.2997552664<br />dimension2: -0.0667750230<br />ID_occurrence: 246<br />Comme je viens de le dire , les aiguilles de son cadran sexuel marquaient alors l' heure de la vérité obscène , mais en ** tombant ** amoureux Rubens régressa aussitôt vers les stades précédents : au lit , il restait muet ou débitait à sa fiancée de tendres métaphores , persuadé que l' obscénité les aurait transportés tous deux hors du territoire de l' amour .<br />src.lang: cs<br />form.fr: ger","dimension1:  0.2734844308<br />dimension2: -0.5072322455<br />ID_occurrence: 247<br />Mlle Brozova rit de nouveau en ** déclarant ** qu' ils n' étaient pas venus pour la Chevauchée des Rois ;<br />src.lang: cs<br />form.fr: ger","dimension1: -0.2064507979<br />dimension2: -0.2319750434<br />ID_occurrence: 275<br />Tu l' as remercié pour de bon ? dit Paul , en ** réprimant ** avec peine son rire .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.0657645228<br />dimension2: -0.3080294686<br />ID_occurrence: 277<br />L' ambassadeur s' assit sur le divan en ** joignant ** les pieds sous son séant comme il l' avait appris au cours de yoga .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.2882331358<br />dimension2: -0.0677143761<br />ID_occurrence: 294<br />Même en ** écartant ** tout ce qui relevait du sentiment ( l' admiration qu' il éprouvait pour le journaliste , l' irritation que lui causait son fils ) , il n' était toujours pas certain qu' il aurait dû signer le texte qu' on lui avait présenté .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.2064507979<br />dimension2: -0.2319750434<br />ID_occurrence: 302<br />« Une femme plus âgée » , avait -il envie de clamer en ** levant ** de nouveau son verre , « c' est une améthyste dans la vie d' un homme ! »<br />src.lang: cs<br />form.fr: ger","dimension1:  0.0928394793<br />dimension2: -0.4589951652<br />ID_occurrence: 309<br />Puis elle demanda , en ** observant ** la photo en couleurs qui ornait la couverture du livre :<br />src.lang: cs<br />form.fr: ger","dimension1: -0.3855161353<br />dimension2: -0.0849104358<br />ID_occurrence: 317<br />La conversation les ayant tout de suite intronisés tous deux comme thème principal , il n' était rien de plus facile que de compléter les mots par des attouchements , et Tomas , tout en ** parlant ** de ses yeux qu' elle plissait , les lui caressait .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.0991951860<br />dimension2: -0.2831226932<br />ID_occurrence: 322<br />On peut en conclure , bien sûr ( et il en était conscient ) , que sa passion pour le dessin et la peinture était moins intense qu' il ne l' avait cru : il s' était trompé , au lycée , en s' ** attribuant ** une vocation d' artiste .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.0459399871<br />dimension2: -0.1709515611<br />ID_occurrence: 330<br />Puis il ajouta en ** plaisantant ** qu' Helena ne s' intéressait pas aux minets , qu' elle était une femme vertueuse mais qu' un gamin comme ça , moins il a de succès , plus il devient enragé et il a sûrement le poing rapide .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.3347956361<br />dimension2: -0.0689774162<br />ID_occurrence: 331<br />Agnès soustrait de son moi tout ce qui est extérieur et emprunté , pour se rapprocher ainsi de sa pure essence ( en ** courant ** le risque d' aboutir à zéro , par ces soustractions successives ) .<br />src.lang: cs<br />form.fr: ger","dimension1:  0.2734844308<br />dimension2: -0.5072322455<br />ID_occurrence: 333<br />Elle commence à se déshabiller en ** disant ** :<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1877346435<br />dimension2: -0.0784038953<br />ID_occurrence: 355<br />Elle ne se trompait pas : en ** apercevant ** Laura dans l' allée bordée de cocotiers qui menait à sa villa , Bernard avait pâli de colère et lui avait dit avec sévérité :<br />src.lang: cs<br />form.fr: ger","dimension1:  0.2734844308<br />dimension2: -0.5072322455<br />ID_occurrence: 356<br />Elle me regardait , épouvantée , en ** rabattant ** sa jupe qui , malgré ses efforts , lui descendait à peine à mi-cuisses ;<br />src.lang: cs<br />form.fr: ger","dimension1:  0.2734844308<br />dimension2: -0.5072322455<br />ID_occurrence: 357<br />Parvenue à deux pas de Paul , elle s' arrêta en ** répétant ** :<br />src.lang: cs<br />form.fr: ger","dimension1:  0.1669232050<br />dimension2: -0.3158134909<br />ID_occurrence: 365<br />Il avait soixante-dix ans , bientôt quatre-vingts , et pourtant il se dressait en ** brandissant ** son verre comme pour se protéger de cette avalanche d' années qui lui tombait sur la tête :<br />src.lang: cs<br />form.fr: ger","dimension1:  0.2734844308<br />dimension2: -0.5072322455<br />ID_occurrence: 395<br />Laura regarda sa sœur au fond des yeux en ** haussant ** les épaules , comme pour admettre que le contenu de la « chose » ne lui apparaissait pas encore clairement .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.0923109393<br />dimension2: -0.1188701605<br />ID_occurrence: 404<br />En ** sortant ** du restaurant , elle se sentait nerveuse .<br />src.lang: cs<br />form.fr: ger","dimension1:  0.0231987792<br />dimension2: -0.4300162605<br />ID_occurrence: 406<br />Celui qui soutenait le coude tendait aux passants le chapeau du musicien , en ** criant ** :<br />src.lang: cs<br />form.fr: ger","dimension1: -0.3375464871<br />dimension2: -0.0664392077<br />ID_occurrence: 413<br />La méthode de Laura est exactement inverse : pour rendre son moi plus visible , plus facile à saisir , pour lui donner plus d' épaisseur , elle lui ajoute sans cesse de nouveaux attributs , auxquels elle tâche de s' identifier ( en ** courant ** le risque de perdre l' essence du moi , sous ces attributs additionnés ) .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.3851290983<br />dimension2: -0.0153000815<br />ID_occurrence: 424<br />Mais comment était -il possible que le souvenir de sa femme , soupirant et criant quatorze ans plus tôt en ** pensant ** à l' ami couché derrière la cloison , comment était -il possible que ce souvenir , après tant d' années , lui fît monter le sang à la tête ?<br />src.lang: cs<br />form.fr: ger","dimension1:  0.0928394793<br />dimension2: -0.4589951652<br />ID_occurrence: 434<br />En ** voyant ** de belles femmes dans la rue , il s' étonna de ne leur prêter aucune attention .<br />src.lang: cs<br />form.fr: ger","dimension1:  0.0882522817<br />dimension2: -0.3642596063<br />ID_occurrence: 435<br />Elle répétait , en ** sanglotant ** , que je ne l' aimais pas .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1518193756<br />dimension2: -0.1512564385<br />ID_occurrence: 438<br />Comme en ** passant ** , il m' avait appelé ami et j' étais sûr que la réconciliation humiliante n' était plus qu' à deux pas ;<br />src.lang: cs<br />form.fr: ger","dimension1: -0.0505077003<br />dimension2: -0.3497481303<br />ID_occurrence: 439<br />Tout en se ** reprochant ** d' avoir cédé , Grizzly savait qu' aucun autre choix n' était possible .<br />src.lang: cs<br />form.fr: ger","dimension1:  0.0406666812<br />dimension2: -0.3494904975<br />ID_occurrence: 448<br />Beaucoup de ses photos parurent à l' étranger dans les journaux les plus divers : on y voyait des tanks , des poings menaçants , des immeubles détruits , des morts recouverts d' un drapeau tricolore ensanglanté , des jeunes gens à moto qui tournaient à toute vitesse autour des chars en agitant des drapeaux tchèques au bout de longues perches , et de très jeunes filles vêtues de minijupes incroyablement courtes , qui provoquaient les malheureux soldats russes sexuellement affamés en ** embrassant ** sous leurs yeux des passants inconnus .<br />src.lang: cs<br />form.fr: ger","dimension1:  0.2322340813<br />dimension2: -0.5117704835<br />ID_occurrence: 452<br />L' unanimité se fit d' ailleurs sur cette dernière idée , que le chœur des enfants reprit à l' unisson en s' ** avançant ** , bras tendu et bouquet au bout .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.2997047876<br />dimension2: -0.0739626338<br />ID_occurrence: 455<br />Le président américain Jimmy Carter m' a toujours été sympathique , mais c' est presque de l' amour que j' ai éprouvé pour lui en le ** voyant ** , sur l' écran de télévision , courir en survêtement avec un groupe de collaborateurs , d' entraîneurs et de gorilles ; soudain la sueur perla à son front , son visage se crispa , ses collaborateurs se penchèrent sur lui , le saisirent à bras-le-corps : une petite crise cardiaque .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.4237887065<br />dimension2: -0.0513254329<br />ID_occurrence: 459<br />Essayons de répondre en nous ** rappelant ** cette jeune femme du sauna qui , avec combativité , affirmait sa prédilection pour les douches froides .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.1448459765<br />dimension2: -0.0858141122<br />ID_occurrence: 466<br />En s' ** approchant ** du lit , Paul vit le corps recouvert d' un drap jusqu' au-dessus de la tête .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.3603026005<br />dimension2: -0.0594426224<br />ID_occurrence: 471<br />- En m' ** invitant ** à votre émission , vous m' avez assuré qu' il s' agirait du film .<br />src.lang: cs<br />form.fr: ger","dimension1: -0.2870761448<br />dimension2: -0.1219287207<br />ID_occurrence: 475<br />Mais préférant éviter ce sujet pour le moment , il répondit en ** rassemblant ** toute sa dignité :<br />src.lang: cs<br />form.fr: ger","dimension1: -0.0798656730<br />dimension2: -0.3155399110<br />ID_occurrence: 497<br />Si l'on se rappelle que les intellectuels hongrois se sont donné le nom de « Cercle Petôfi » , quand en 1956 ils se sont dressés contre l' Empire russe en ** déclenchant ** le premier grand soulèvement anti-stalinien , on constate que , par ses amours , Bettina est présente sur le vaste champ de l' histoire européenne , depuis le XVIIIe siècle jusqu' à la moitié du nôtre .<br />src.lang: cs<br />form.fr: ger"],"type":"scatter","mode":"markers","marker":{"autocolorscale":false,"color":"rgba(248,118,109,1)","opacity":0.5,"size":15.118110236220474,"symbol":"triangle-up","line":{"width":1.8897637795275593,"color":"rgba(248,118,109,1)"}},"hoveron":"points","name":"(cs,ger)","legendgroup":"(cs,ger)","showlegend":true,"xaxis":"x","yaxis":"y","hoverinfo":"text","frame":null},{"x":[0.20424107872259722,0.50269264563289784,0.42080859947174171,0.10585728179165674,0.22215019869099301,0.12800705449852584,0.32306576398673348,0.14891894943339165,0.23999582521461563,0.12486408183589587,0.027098043656660374,0.092215847330831199,0.059127398132024722,0.33827723204264953,0.26467363954916978,0.47228181334078723,0.53650721287473924,0.32737797708107175,0.51222500097125656,0.091910819039692948,0.31714009000196597,0.36248891 33671,-0.21605914380808974,0.3452280143224758,0.001367438749128361,0.30403654044219447,0.27325501681524234,0.45077949856988259,-0.20994259937898271,0.060830478629463912,0.29603064375065929,-0.11254940034452186,-0.21582365202193762,0.0799532988914812,0.35969856553202484,0.28893874843330625,0.17220221324576393,-0.043096333762466139,0.091322920324346024,0.23981569267885197],"text":["dimension1:  0.2091561895<br />dimension2:  0.4218587688<br />ID_occurrence:   5<br />Habitué aux travaux de Cenek depuis l' ère de l' ancien commandant , le commissaire , parfaitement indifférent au nouveau tableau , entama à haute voix la lecture d' une brochure ** éclairant ** les différences entre une armée socialiste et une armée capitaliste .<br />src.lang: cs<br />form.fr: part","dimension1:  0.5130465786<br />dimension2: -0.2158418148<br />ID_occurrence:   7<br />« Plus fort , plus fort , encore , encore ! » et à cet instant il s' apercevait qu' il n' en pouvait plus ; il lui avait fait l' amour trop longtemps et sur un rythme trop rapide pour pouvoir frapper à coups redoublés ; ** glissant ** alors sur le côté , il recourait à un expédient qui lui semblait à la fois un aveu d' échec et une virtuosité technique digne d' un brevet : enfonçant profondément la main dans son ventre , il effectuait avec les doigts de puissants mouvements de bas en haut ; un geyser jaillissait , c' était une inondation , elle l' embrassait et le couvrait de mots doux .<br />src.lang: cs<br />form.fr: part","dimension1:  0.4197726018<br />dimension2: -0.0993458255<br />ID_occurrence:  13<br />Le nègre montra de superbes dents blanches , et Laura ** tirant ** du panier un bouquet de cinq œillets à demi fanés le tendit à Paul :<br />src.lang: cs<br />form.fr: part","dimension1:  0.0903445622<br />dimension2:  0.2626539894<br />ID_occurrence:  14<br />Oui , tel est bien le mot que vous prononcez le plus souvent , ** écoutant ** cette affaire ou d' autres pareilles .<br />src.lang: cs<br />form.fr: part","dimension1:  0.2273197816<br />dimension2:  0.4544987016<br />ID_occurrence:  15<br />Kennedy ** riant ** devant l' objectif d' un photographe ne réagit nullement à une situation comique , mais ouvre très consciemment la bouche et découvre les dents .<br />src.lang: cs<br />form.fr: part","dimension1:  0.1336693453<br />dimension2:  0.4587180934<br />ID_occurrence:  20<br />Elle avait une image devant les yeux : un lièvre ** détalant ** dans un sillon , un garde-chasse au feutre vert et le clocher d' une église au-dessus de la forêt .<br />src.lang: cs<br />form.fr: part","dimension1:  0.3056371946<br />dimension2: -0.0452413504<br />ID_occurrence:  25<br />N' était -ce pas plutôt la réaction hystérique d' un homme qui , ** comprenant ** en son for intérieur son inaptitude à l' amour , commençait à se jouer à lui-même la comédie de l' amour ?<br />src.lang: cs<br />form.fr: part","dimension1:  0.1562475727<br />dimension2:  0.2023408377<br />ID_occurrence:  26<br />Elle n' avait pas pu y rester , son mari ** étant ** à la recherche d' un emploi urbain .<br />src.lang: cs<br />form.fr: part","dimension1:  0.2555980601<br />dimension2:  0.3935372428<br />ID_occurrence:  32<br />Ainsi , lors des arrivées de Lucie au grillage , je n' étais pas seul à l' observer , mais avec moi une bonne dizaine de copains ** sachant ** avec exactitude comment Lucie aimait , ce qu' alors elle disait ou comme elle soupirait , et chaque fois ils constataient d' un air entendu qu' elle était encore chaussée des escarpins noirs , et ils l' imaginaient nue , se promenant sur ces échasses d' un coin à l' autre de la petite chambre .<br />src.lang: cs<br />form.fr: part","dimension1:  0.1372041662<br />dimension2:  0.2684386107<br />ID_occurrence:  33<br />Accablé d' un terrible regret , je caressai sa tête dégarnie , ses longs cheveux fins qui tentaient tristement de couvrir sa calvitie , et je constatai avec frayeur que ce voyage dans ma ville natale où j' avais voulu atteindre le Zemanek haï m' amenait , pour finir , à porter dans mes bras mon copain terrassé ( oui , je me voyais à cet instant , le ** tenant ** sur mes bras , le tenant et le portant , immense et lourd , comme si j' avais porté ma propre faute obscure , je me voyais l' emportant à travers une foule , je me voyais en pleurs ) .<br />src.lang: cs<br />form.fr: part","dimension1:  0.0233957216<br />dimension2:  0.2542259346<br />ID_occurrence:  36<br />Ces vers ont tous un nombre de syllabes différent , les trochées , les iambes , les dactyles alternent , le sixième vers est étrangement plus long que les autres ; et bien que le poème se compose de deux quatrains , la première phrase grammaticale se termine asymétriquement dans le cinquième vers , ** créant ** une mélodie qui n' existe nulle part ailleurs que dans ce seul et unique poème , aussi superbe que parfaitement ordinaire .<br />src.lang: cs<br />form.fr: part","dimension1:  0.0779990691<br />dimension2:  0.4166810768<br />ID_occurrence:  39<br />À propos du rapport entre idéologie et imagolo-gie , j' ajoute encore ceci : les idéologies étaient comme d' immenses roues , ** tournant ** en coulisse et déclenchant les guerres , les révolutions , les réformes .<br />src.lang: cs<br />form.fr: part","dimension1:  0.0778772353<br />dimension2:  0.4165546277<br />ID_occurrence:  73<br />nul n' en sait le sens ou le message , mais , de même que les hiéroglyphes de l' Égypte ancienne sont plus beaux pour ceux qui ne savent pas les lire ( et ne les perçoivent qu' en tant que dessins fantastiques ) , il se peut que la Chevauchée des Rois soit si belle parce que le contenu de sa communication est perdu depuis longtemps et que ressortent d' autant plus les gestes , les couleurs , les mots , ** attirant ** l' attention sur eux-mêmes , sur leur aspect , sur leur forme .<br />src.lang: cs<br />form.fr: part","dimension1:  0.3223599100<br />dimension2: -0.1453301544<br />ID_occurrence:  76<br />Mais pendant leur trajet , les aiguilles des astres vont toucher chacun des points immobiles de l' horoscope , ** mettant ** ainsi en jeu ( affaiblissant , fortifiant , menaçant ) les diverses composantes de votre thème vital .<br />src.lang: cs<br />form.fr: part","dimension1:  0.2622655451<br />dimension2:  0.1007911112<br />ID_occurrence:  77<br />Elle était descendue du train bien avant d' arriver dans cette ville , ** cédant ** à une peur panique .<br />src.lang: cs<br />form.fr: part","dimension1:  0.4805529488<br />dimension2: -0.1574422151<br />ID_occurrence:  87<br />Je l' embrassais ( si terriblement longtemps que je n' y trouvai plus aucun plaisir ) , la câlinais ( sans sincérité ) , ** cherchant ** , sans en avoir l' air , à la coucher de tout son long .<br />src.lang: cs<br />form.fr: part","dimension1:  0.5280376208<br />dimension2: -0.2241438259<br />ID_occurrence:  90<br />On appelait téléphone arabe un jeu auquel il avait beaucoup joué entre cinq et sept ans : les enfants se ** tenant ** assis côte à côte , le premier chuchotait une longue phrase au second qui la chuchotait au troisième , lequel la répétait au quatrième , et ainsi de suite jusqu' au dernier qui la prononçait à voix haute , d' où un rire général devant la différence entre la phrase initiale et son ultime transformation .<br />src.lang: cs<br />form.fr: part","dimension1:  0.3175060111<br />dimension2: -0.1691064882<br />ID_occurrence:  94<br />Chez les peintres , le désir d' « aller de l' avant » devint névrose ; ils se mettaient tous à courir dans tous les sens , se ** croisant ** sans cesse les uns les autres comme des passants agités sur la même place d' une même ville .<br />src.lang: cs<br />form.fr: part","dimension1:  0.5280376208<br />dimension2: -0.2241438259<br />ID_occurrence:  96<br />Puis , ** disparaissant ** aux yeux du peuple , il se retrouva seul parmi les tombeaux de soixante-quatre morts illustres , n' étant suivi dans sa solitude pensive que d' une caméra , d' une équipe de cinéastes et de quelques millions de Français q e se tuer .<br />src.lang: de<br />form.fr: ger","dimension1:  0.2602229821<br />dimension2: -0.4576896358<br />ID_occurrence:  86<br />Un beau jour , en ** arrivant ** chez soi , on découvrait sur sa table toutes les requêtes qu’ on avait rédigées avec tant de zèle et d’ espoir ;<br />src.lang: de<br />form.fr: ger","dimension1:  0.2105812135<br />dimension2: -0.3969021075<br />ID_occurrence:  98<br />– Fort juste , dit le brigadier en ** comptant ** les allumettes de la boîte .<br />src.lang: de<br />form.fr: ger","dimension1: -0.4562835099<br />dimension2: -0.0671495386<br />ID_occurrence:  99<br />« Quels malotrus ! » dit K. en se ** retournant ** .<br />src.lang: de<br />form.fr: ger","dimension1:  0.1589324195<br />dimension2: -0.4944867101<br />ID_occurrence: 119<br />– Je ne puis plus , hélas ! rester que quelques minutes , dit aimablement le chef de bureau en s’ asseyant profondément dans le fauteuil et en ** regardant ** sa montre .<br />src.lang: de<br />form.fr: ger","dimension1: -0.2986769048<br />dimension2: -0.1199719647<br />ID_occurrence: 129<br />Vous figurez -vous que vous amènerez plus vite la fin de ce sacré procès en ** discutant ** avec nous , les gardiens , sur votre mandat d’ arrestation et sur vos papiers d’ identité ?<br />src.lang: de<br />form.fr: ger","dimension1:  0.2556236816<br />dimension2: -0.5130625867<br />ID_occurrence: 141<br />– Pas tant de discours , dit K. en ** tendant ** la main vers la femme .<br />src.lang: de<br />form.fr: ger","dimension1: -0.2592540505<br />dimension2: -0.0626848675<br />ID_occurrence: 148<br />Il se sentait un peu perdu en ** traversant ** sous les yeux du prêtre ces longues rangées de bancs vides ;<br />src.lang: de<br />form.fr: ger","dimension1:  0.2734844308<br />dimension2: -0.5072322455<br />ID_occurrence: 153<br />« Non , dit celui qui était près de la fenêtre , en jetant son livre sur une petite table et en se ** levant ** , vous n’ avez pas le droit de sortir , vous êtes arrêté .<br />src.la -0.3688255273<br />dimension2: -0.1120345952<br />ID_occurrence:  53<br />On se mit à la besogne , en ** faisant ** le moins de bruit possible .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.2929511058<br />dimension2: -0.1660336573<br />ID_occurrence:  56<br />Le maître présenta son passeport , en ** priant ** laconiquement le consul de vouloir bien y apposer son visa .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3533730905<br />dimension2: -0.0948633321<br />ID_occurrence:  58<br />La jeune femme , assise à l' arrière , se sentait émue en ** contemplant ** cet océan , assombri déjà par le crépuscule , qu' elle bravait sur une frêle embarcation .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.2475652980<br />dimension2: -0.0444612224<br />ID_occurrence:  78<br />La plupart des voyageurs connaissaient cette interruption de la voie , et , en ** descendant ** du train , ils s' étaient emparés des véhicules de toutes sortes que possédait la bourgade , palkigharis à quatre roues , charrettes traînées par des zébus , sortes de boeufs à bosses , chars de voyage ressemblant à des pagodes ambulantes , palanquins , poneys , etc.<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3952555386<br />dimension2:  0.0139218869<br />ID_occurrence:  84<br /> Monsieur \" , lui dit-il en le ** regardant ** fixement , \"\" c' est du lapin , cela ? \"\"<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4196046990<br />dimension2:  0.0199981411<br />ID_occurrence: 112<br /> Pas de réflexion , c' est inutile ! \" répondit l' Américain interpellé en ** haussant ** les épaules , \"\" puisque le mécanicien assure qu' on passera ! \"\"<br />src.lang: fr<br />form.fr: ger","dimension1: -0.2209189735<br />dimension2: -0.2020681717<br />ID_occurrence: 114<br />Tout en ** circulant ** au milieu de ce populaire , Fix , par une habitude de sa profession , dévisageait les passants d' un rapide coup d' oeil .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3777305874<br />dimension2: -0.0914287128<br />ID_occurrence: 121<br />Phileas Fogg , en ** quittant ** Londres , ne se doutait guère , sans doute , du grand retentissement qu' allait provoquer son départ .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4293961320<br />dimension2:  0.0242971648<br />ID_occurrence: 125<br /> Une , monsieur ! \" répondit le Mormon en ** levant ** les bras au ciel , \"\" une , et c' était assez ! \"\"<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4293961320<br />dimension2:  0.0242971648<br />ID_occurrence: 135<br />Pendant toute la journée , l' embarcation courut ainsi vers le nord , emportée par les lames monstrueuses , en ** conservant ** heureusement une rapidité égale à la leur .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.2427154412<br />dimension2: -0.1042628582<br />ID_occurrence: 149<br />Quant à Passepartout , il saisit la main du pilote et l' étreignit vigoureusement en ** disant ** :<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4413203616<br />dimension2: -0.0278109931<br />ID_occurrence: 155<br />Le Parsi , très familiarisé avec les routes et sentiers du pays , prétendait gagner une vingtaine de milles en ** coupant ** à travers la forêt , et on s' en rapporta à lui .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3124322479<br />dimension2: -0.0972063029<br />ID_occurrence: 162<br /> A vous de couper , monsieur \" , ajouta -t-il en ** présentant ** les cartes à Thomas Flanagan .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4293961320<br />dimension2:  0.0242971648<br />ID_occurrence: 165<br /> Là , au coin de la place , \" répondit l' inspecteur en ** indiquant ** une maison éloignée de deux cents pas .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3156376445<br />dimension2:  0.0181788293<br />ID_occurrence: 179<br /> Trente hommes de bonne volonté ! \" ajouta -t-il en se ** tournant ** vers ses soldats .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4589743009<br />dimension2: -0.0258298812<br />ID_occurrence: 188<br />Et tes amis seront bien étonnés de te voir rire en ** regardant ** le ciel .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3124322479<br />dimension2: -0.0972063029<br />ID_occurrence: 189<br />Tout en ** fouillant ** ma poche pour en tirer mon revolver , je pris le pas de course , mais , au bruit que je fis , le serpent se laissa doucement couler dans le sable , comme un jet d’ eau qui meurt , et , sans trop se presser , se faufila entre les pierres avec un léger bruit de métal .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4559518384<br />dimension2: -0.0995572812<br />ID_occurrence: 193<br /> En ** prétendant ** que j' avais tort de jouer pique , le colonel m' a fait une nouvelle injure , et il m' en rendra raison . \"\"<br />src.lang: fr<br />form.fr: ger","dimension1: -0.2476581889<br />dimension2: -0.1551005777<br />ID_occurrence: 204<br /> Ah ! monsieur … monsieur Fogg ! \" s' écria la jeune femme , en ** saisissant ** les mains de son compagnon qu' elle couvrit de larmes .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3284524742<br />dimension2: -0.1267890735<br />ID_occurrence: 225<br />Passepartout , qui avait consciencieusement étudié son programme , fut assez surpris en ** voyant ** Mr . Fogg , coupable d' inexactitude , apparaître à cette heure insolite .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4670808001<br />dimension2: -0.0403693794<br />ID_occurrence: 230<br />En effet , en ** marchant ** vers l' est , Phileas Fogg allait au-devant du soleil , et , par conséquent les jours diminuaient pour lui d' autant de fois quatre minutes qu' il franchissait de degrés dans cette direction .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3703470234<br />dimension2: -0.0450354887<br />ID_occurrence: 232<br />Phileas Fogg et Fix , en ** préservant ** la jeune femme , furent horriblement bousculés .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.1371311915<br />dimension2:  0.0145499657<br />ID_occurrence: 264<br />Précisément , à Hong-Kong , résidait un de ses parents , Parsi comme elle , et l' un des principaux négociants de cette ville , qui est absolument anglaise , tout en ** occupant ** un point de la côte chinoise .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4677822552<br />dimension2: -0.0822022577<br />ID_occurrence: 290<br />Elle parlait l' anglais avec une grande pureté , et le guide n' avait point exagéré en ** affirmant ** que cette jeune Parsie avait été transformée par l' éducation .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4040310691<br />dimension2: -0.0335212262<br />ID_occurrence: 298<br />Fix s' était trompé comme tout le monde à l' égard de Phileas Fogg , et , en le ** filant ** , en l' arrêtant , il n' avait fait que son devoir , tandis que lui …<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3151064883<br />dimension2: -0.0569254806<br />ID_occurrence: 307<br />Phileas Fogg apaisa sa fureur en lui ** jetant ** une poignée de bank-notes .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4585973415<br />dimension2: -0.0238378776<br />ID_occurrence: 341<br /> Je ne donnerais pas ma part de quatre mille livres dans le pari \" , dit Andrew Stuart en s' ** asseyant ** , \"\" quand même on m' en offrirait trois mille neuf cent quatre-vingt-dix-neuf ! \"\"<br />src.lang: fr<br />form.fr: ger","dimension1: -0.1765136881<br />dimension2: -0.1343531425<br />ID_occurrence: 346<br />Pour lui , il n' avait eu qu' une idée \"\" drôle , et il riait en ** songeant ** que , pendant quelques instants , lui , Passepartout , ancien gymnaste , ex-sergent de pompiers , avait été le veuf d' une charmante femme , un vieux rajah embaumé !<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3194511100<br />dimension2: -0.1367539719<br />ID_occurrence: 349<br /> Je ne me trompe pas \" , dit-il en l' ** abordant ** avec son plus aimable sourire , \"\" c' est bien vous , monsieur , qui m' avez si complaisamment servi de guide à Suez ? \"\"<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3952321156<br />dimension2:  0.0177633067<br />ID_occurrence: 372<br />Dans les rues , ce n' était que fourmillement , va-et-vient incessant : bonzes passant processionnellement en ** frappant ** leurs tambourins monotones , yakounines , officiers de douane ou de police , à chapeaux pointus incrustés de laque et portant deux sabres à leur ceinture , soldats vêtus de cotonnades bleues à raies blanches et armés de fusil à percussion , hommes d' armes du mikado , ensachés dans leur pourpoint de soie , avec haubert et cotte de mailles , et nombre d' autres militaires de toutes conditions , - car , au Japon , la profession de soldat est autant estimée qu' elle est dédaignée en Chine .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3594067758<br />dimension2: -0.0288467716<br />ID_occurrence: 383<br /> Je crois qu' en ** lançant ** le train avec son maximum de vitesse , on aurait quelques chances de passer . \"\"<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3742893506<br />dimension2:  0.0642792284<br />ID_occurrence: 386<br /> Je sais bien \" , répondit Passepartout en s' ** adressant ** à un autre gentleman , \"\" mais une simple réflexion … \"\"<br />src.lang: fr<br />form.fr: ger","dimension1: -0.1414099991<br />dimension2: -0.1926841129<br />ID_occurrence: 394<br />Fort heureusement il avait été de son côté à la découverte , et en ** hésitant ** un peu :<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3124322479<br />dimension2: -0.0972063029<br />ID_occurrence: 401<br /> Rien \" , répondit Passepartout en ** vidant ** encore une fois son verre .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.4404126972<br />dimension2: -0.0512356530<br />ID_occurrence: 417<br />Tout en ** faisant ** ses emplettes , Passepartout eut bientôt vu la ville , autrefois défendue par un fort magnifique qui est devenu une prison d' État .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3029694688<br />dimension2: -0.0975525765<br />ID_occurrence: 418<br />En effet , en ** arrivant ** et en admettant que le sieur Fogg n' en jetât pas encore quelques poignées à la mer , plus de sept mille livres ( 175 000 F ) manqueraient au sac à bank-notes !<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3470248991<br />dimension2: -0.1616800020<br />ID_occurrence: 422<br />Il avait confié ses inquiétudes à Fix , qui - le fin renard - essayait de le consoler , en lui ** disant ** que Mr . Fogg en serait quitte pour prendre le prochain paquebot .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3436442783<br />dimension2:  0.0163527407<br />ID_occurrence: 427<br /> Yankee ! \" dit Mr . Fogg , en ** lançant ** à son adversaire un regard de profond mépris .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.2457669711<br />dimension2: -0.0682765405<br />ID_occurrence: 437<br /> Monsieur Fix \" , dit-il en ** balbutiant ** , \"\" quand bien même tout ce que vous m' avez dit serait vrai … quand mon maître serait le voleur que vous cherchez … ce que je nie … j' ai été … je suis à son service … je l' ai vu bon et généreux . \"\"<br />src.lang: fr<br />form.fr: ger","dimension1: -0.2481340486<br />dimension2: -0.0642858279<br />ID_occurrence: 443<br /> Je ne sais , mon officier \" , répondit le Parsi , en ** prêtant ** l' oreille à un murmure confus qui passais sous l' épaisse ramure .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.3911158625<br />dimension2:  0.0346532918<br />ID_occurrence: 444<br /> Moi , monsieur Fogg ! … \" répondit Mrs . Aouda , en ** comprimant ** les battements de son coeur .<br />src.lang: fr<br />form.fr: ger","dimension1: -0.1557975377<br />dimension2: -0.2147460761<br />ID_occurrence: 453<br />Son front ne s' assombrit pas un instant , et , cependant , un retard de vingt heures pouvait compromettre son voyage en lui ** faisant ** manquer le départ du paquebot de Yokohama .<br />src.lang: fr<br />form.fr: ger","dimension e s' était pas écoulée , que l' honnête garçon , ** ayant ** coupé son nez et rogné ses ailes , n' avait plus rien en lui qui rappelât le sectateur du dieu Tingou .<br />src.lang: fr<br />form.fr: part","dimension1:  0.0402566729<br />dimension2:  0.1768861404<br />ID_occurrence:  54<br />En quittant l' île de Bombay , il traverse Salcette , saute sur le continent en face de Tannah , franchit la chaîne des Ghâtes-Occidentales , court au nord-est jusqu' à Burhampour , sillonne le territoire à peu près indépendant du Bundelkund , s' élève jusqu' à Allahabad , s' infléchit vers l' est , rencontre le Gange à Bénarès , s' en écarte légèrement , et , ** redescendant ** au sud-est par Burdivan et la ville française de Chandernagor , il fait tête de ligne à Calcutta .<br />src.lang: fr<br />form.fr: part","dimension1: -0.1903545772<br />dimension2:  0.3097721601<br />ID_occurrence:  59<br /> Mais voilà cinq ans que j' ai quitté la France et que , ** voulant ** goûter de la vie de famille , je suis valet de chambre en Angleterre . \"\"<br />src.lang: fr<br />form.fr: part","dimension1:  0.2937860328<br />dimension2: -0.0881238569<br />ID_occurrence:  60<br />Au moment où Mr . Fogg allait s' embarquer , il avisa un employé et le ** rejoignant ** :<br />src.lang: fr<br />form.fr: part","dimension1: -0.0349316964<br />dimension2:  0.1519421849<br />ID_occurrence:  70<br />Mais ils enduraient la situation avec le flegme le plus britannique , ** causant ** peu d' ailleurs , et se voyant à peine l' un l' autre .<br />src.lang: fr<br />form.fr: part","dimension1:  0.1936660778<br />dimension2:  0.2611888768<br />ID_occurrence:  71<br />Peut-être l' opinion de Fix ** touchant ** Phileas Fogg était -elle en effet modifiée .<br />src.lang: fr<br />form.fr: part","dimension1:  0.2271363397<br />dimension2:  0.4511288414<br />ID_occurrence:  74<br />Là s' arrêtèrent les deux puissantes locomotives , ** remorquant ** les neuf wagons des invités , au nombre desquels figurait le vice-président , Mr. Thomas C. Durant ;<br />src.lang: fr<br />form.fr: part","dimension1:  0.1399969841<br />dimension2:  0.0590471586<br />ID_occurrence:  79<br />Et , en effet , il n' était pas une heure , que ce guide habile , ** abandonnant ** la barre , se précipitait aux drisses des voiles et les amenait en bande , pendant que le traîneau , emporté par son irrésistible élan , franchissait encore un demi-mille à sec de toile .<br />src.lang: fr<br />form.fr: part","dimension1: -0.0753450043<br />dimension2:  0.2798799613<br />ID_occurrence:  82<br />Le capitaine , ** voyant ** un pavillon en berne , s' était dirigé vers la petite goélette .<br />src.lang: fr<br />form.fr: part","dimension1:  0.1260043280<br />dimension2:  0.4452971198<br />ID_occurrence:  91<br />C' était un corps grave , ** parcourant ** une orbite autour du globe terrestre , suivant les lois de la mécanique rationnelle .<br />src.lang: fr<br />form.fr: part","dimension1: -0.1336013561<br />dimension2:  0.2153944476<br />ID_occurrence: 101<br />Un jour , par exemple , ** parlant ** de ses quatre épines , elle avait dit au petit prince :<br />src.lang: fr<br />form.fr: part","dimension1:  0.3867146437<br />dimension2:  0.0292996131<br />ID_occurrence: 105<br />Mais son hésitation ne dura pas , et d' un geste , ** appelant ** un de ses lieutenants , il lui donnait l' ordre de pousser une reconnaissance dans le sud - , quand des coups de feu éclatèrent .<br />src.lang: fr<br />form.fr: part","dimension1: -0.0643129260<br />dimension2:  0.2820787867<br />ID_occurrence: 110<br />NA<br />src.lang: fr<br />form.fr: part","dimension1: -0.1961751899<br />dimension2:  0.2930412003<br />ID_occurrence: 115<br /> Imbécile ! \" répondit l' inspecteur , qui s' en alla , ** haussant ** les épaules .<br />src.lang: fr<br />form.fr: part","dimension1: -0.0028455525<br />dimension2:  0.1143844324<br />ID_occurrence: 120<br />Passepartout l' accompagnait , ** portant ** une paire de revolvers .<br />src.lang: fr<br />form.fr: part","dimension1: -0.1038076991<br />dimension2:  0.1543091776<br />ID_occurrence: 133<br />Mr . Fogg , ne ** voulant ** pas exposer Mrs . Aouda aux tortures d' une traversée en plein air , par ce froid que la vitesse rendrait plus insupportable encore , lui proposa de rester sous la garde de Passepartout à la station de Kearney .<br />src.lang: fr<br />form.fr: part","dimension1: -0.1204433441<br />dimension2:  0.2826151990<br />ID_occurrence: 143<br />D' ailleurs , la Tankadère portait admirablement la toile , ** ayant ** un grand tirant d' eau , et tout était paré à amener rapidement , en cas de grain .<br />src.lang: fr<br />form.fr: part","dimension1:  0.0913400771<br />dimension2:  0.1668982368<br />ID_occurrence: 144<br />L' agent passa là quelques heures difficiles , tantôt croyant tout perdu , tantôt ** espérant ** que Fogg ignorait la situation , enfin ne sachant quel parti prendre .<br />src.lang: fr<br />form.fr: part","dimension1:  0.2767502902<br />dimension2:  0.0136240520<br />ID_occurrence: 161<br />NA<br />src.lang: fr<br />form.fr: part","dimension1:  0.4027641991<br />dimension2: -0.0442707501<br />ID_occurrence: 169<br />Puis , ** prenant ** Passepartout par la ceinture et l' enroulant de sa trompe , il l' enleva jusqu' à la hauteur de sa tête .<br />src.lang: fr<br />form.fr: part","dimension1: -0.0535397985<br />dimension2:  0.2926773834<br />ID_occurrence: 176<br />On rappela ce que l' existence de Phileas Fogg avait de mystérieux , son isolement , son départ subit , et il parut évident que ce personnage , ** prétextant ** un voyage autour du monde et l' appuyant sur un pari insensé , n' avait eu d' autre but que de dépister les agents de la police anglaise .<br />src.lang: fr<br />form.fr: part","dimension1: -0.1691917870<br />dimension2:  0.2642386246<br />ID_occurrence: 181<br />Et , ** marchant ** ainsi , je découvris le puits au lever du jour .<br />src.lang: fr<br />form.fr: part","dimension1:  0.3381184534<br />dimension2: -0.0727291599<br />ID_occurrence: 184<br />Déjeunant , ** dînant ** au club à des heures chronométriquement déterminées , dans la même salle , à la même table , ne traitant point ses collègues , n' invitant aucun étranger , il ne rentrait chez lui que pour se coucher , à minuit précis , sans jamais user de ces chambres confortables que le Reform-Club tient à la disposition des membres du cercle .<br />src.lang: fr<br />form.fr: part","dimension1: -0.1038076991<br />dimension2:  0.1543091776<br />ID_occurrence: 185<br />Il évitait toujours les lieux habités , se ** sentant ** plus en sûreté dans ces campagnes désertes , qui marquent les premières dépressions du bassin du grand fleuve .<br />src.lang: fr<br />form.fr: part","dimension1:  0.0281186459<br />dimension2:  0.2583274024<br />ID_occurrence: 191<br /> Or , me ** trouvant ** sans place et ayant appris que M. Phileas Fogg était l' homme le plus exact et le plus sédentaire du Royaume-Uni , je me suis présenté chez monsieur avec l' espérance d' y vivre tranquille et d' oublier jusqu' à ce nom de Passepartout … \"\"<br />src.lang: fr<br />form.fr: part","dimension1:  0.1229969011<br />dimension2:  0.0813475256<br />ID_occurrence: 198<br />Phileas Fogg n' eut pas le temps d' arrêter ce courageux garçon , qui , ** ouvrant ** une portière sans être vu des Indiens , parvint à se glisser sous le wagon .<br />src.lang: fr<br />form.fr: part","dimension1: -0.0028455525<br />dimension2:  0.1143844324<br />ID_occurrence: 199<br />Puis ** levant ** les yeux sur Mrs . Aouda :<br />src.lang: fr<br />form.fr: part","dimension1:  0.2970325843<br />dimension2: -0.1194826686<br />ID_occurrence: 206<br />Le Parsi se jucha sur le cou de l' éléphant , et à neuf heures l' animal , ** quittant ** la bourgade , s' enfonçait par le plus court dans l' épaisse forêt de lataniers .<br />src.lang: fr<br />form.fr: part","dimension1: -0.0506954916<br />dimension2:  0.2134409722<br />ID_occurrence: 208<br />Mrs . Aouda s' était retirée dans une chambre de la gare , et là , seule , elle attendait , ** songeant ** à Phileas Fogg , à cette générosité simple et grande , à ce tranquille courage .<br />src.lang: fr<br />form.fr: part","dimension1:  0.2309413384<br />dimension2: -0.0215347774<br />ID_occurrence: 210<br />Puis , sa pensée la reportant aux scènes du sutty , ses regards ** revoyant ** cette terre indienne où tant de dangers l' attendaient encore , elle fut prise d' un frisson de terreur .<br />src.lang: fr<br />form.fr: part","dimension1:  0.2417748063<br />dimension2:  0.0172219580<br />ID_occurrence: 213<br />A l' arrivée de la machine , Mrs . Aouda avait quitté la gare , et s' ** adressant ** au conducteur :<br />src.lang: fr<br />form.fr: part","dimension1:  0.1147151980<br />dimension2:  0.1974476990<br />ID_occurrence: 220<br />Sa nature reprenait le dessus , il s' incriminait , il s' accusait , il se traitait comme s' il eût été le directeur de la police métropolitaine , ** admonestant ** un agent pris en flagrant délit de naïveté .<br />src.lang: fr<br />form.fr: part","dimension1:  0.2547370704<br />dimension2:  0.4065870816<br />ID_occurrence: 223<br />Une liasse de bank-notes , ** formant ** l' énorme somme de cinquante-cinq mille livres , avait été prise sur la tablette du caissier principal de la Banque d' Angleterre .<br />src.lang: fr<br />form.fr: part","dimension1:  0.2367937993<br />dimension2: -0.0503730142<br />ID_occurrence: 224<br />Et alors , tandis que la lutte continuait , pendant que les balles se croisaient au-dessus de sa tête , retrouvant son agilité , sa souplesse de clown , se ** faufilant ** sous les wagons , s' accrochant aux chaînes , s' aidant du levier des freins et des longerons des châssis , rampant d' une voiture à l' autre avec une adresse merveilleuse , il gagna ainsi l' avant du train .<br />src.lang: fr<br />form.fr: part","dimension1: -0.0856837588<br />dimension2:  0.2269519041<br />ID_occurrence: 231<br />Le revolver à la main , elle se défendait héroïquement , ** tirant ** à travers les vitres brisées , lorsque quelque sauvage se présentait à elle .<br />src.lang: fr<br />form.fr: part","dimension1:  0.5280376208<br />dimension2: -0.2241438259<br />ID_occurrence: 234<br />« Elle serait bien vexée , se dit-il , si elle voyait ça … elle tousserait énormément et ferait ** semblant ** de mourir pour échapper au ridicule .<br />src.lang: fr<br />form.fr: part","dimension1:  0.2399989629<br />dimension2:  0.3853889395<br />ID_occurrence: 236<br />mais William Hitch , continuant , raconta \"\" comment Smyth junior , réunissant son père , ses deux frères et quelques disciples , fonda la religion des Saints des derniers jours - , religion qui , adoptée non seulement en Amérique , mais en Angleterre , en Scandinavie , en Allemagne , compte parmi ses fidèles des artisans et aussi nombre de gens ** exerçant ** des professions libérales ;<br />src.lang: fr<br />form.fr: part","dimension1: -0.1645330511<br />dimension2:  0.2928260756<br />ID_occurrence: 251<br /> Non \" , répondit bravement Passepartout , qui s' enfuit à son tour , ** laissant ** l' énergumène prêcher dans le désert .<br />src.lang: fr<br />form.fr: part","dimension1: -0.0284821685<br />dimension2:  0.2657238581<br />ID_occurrence: 254<br />Et , ** redoublant ** de précaution , suivi de ses compagnons , il se glissa silencieusement à travers les grandes herbes .<br />src.lang: fr<br />form.fr: part","dimension1:  0.1782833841<br />dimension2:  0.1376493513<br />ID_occurrence: 256<br />Cela ne pouvait être difficile , le gentleman ** étant ** d' un naturel peu remuant et peu curieux .<br />src.lang: fr<br />form.fr: part","dimension1: -0.0674457128<br />dimension2:  0.3543978998<br />ID_occurrence: 262<br />Passepartout , ** voulant ** avant tout pouvoir respecter son maître , risqua quelques respectueuses observations qui furent mal reçues , et il rompit .<br />src.lang: fr<br />form.fr: part","dimension1:  0.1832987422<br />dimension2:  0.3231864255<br />ID_occurrence: 265<br />C' était un vaste steamer à roues , ** jaugeant ** deux mille cinq cents tonnes , bien aménagé et doué d' une grande vitesse .<br />src.lang: fr<br />form.fr: part","dimension1:  0.2100927580<br />dimension2:  0.1216728948<br />ID_occurrence: 271<br />L' agent passa là quelques heures difficiles , tantôt croyant tout perdu , tantôt espérant que Fogg ignorait la situation , enfin ne ** sachant ** quel parti prendre .<br />src.lang: fr<br />form.fr: part","dimension1:  0.0541835915<br />dimension2:  0.0337722208<br />ID_occurrence: 273<br />Il quittait ce lit d' ivrognes , et trébuchant , s' appuyant aux murailles , tombant et se relevant , mais toujours et irrésistiblement poussé par une sorte d' instinct , il sortait de la tabagie , ** criant ** comme dans un rêve :<br />src.lang: fr<br />form.fr: part","dimension1:  0.1487037034<br />dimension2:  0.3656266203<br />ID_occurrence: 282<br />Le Rangoon , l' un des paquebots que la Compagnie péninsulaire et orientale emploie au service des mers de la Chine et du Japon , était un steamer en fer , à hélice , ** jaugeant ** brut dix-sept cent soixante-dix tonnes , et d' une force nominale de quatre cents chevaux .<br />src.lang: fr<br />form.fr: part","dimension1: -0.1038076991<br />dimension2:  0.1543091776<br />ID_occurrence: 283<br />On voyait ces ruminants - ces buffalos , comme les appellent improprement les Américains - marcher ainsi de leur pas tranquille , ** poussant ** parfois des beuglements formidables .<br />src.lang: fr<br />form.fr: part","dimension1:  0.0378652027<br />dimension2:  0.1646491329<br />ID_occurrence: 284<br />Fix se releva , en assez mauvais état , et , ** regardant ** son adversaire , il lui dit froidement :<br />src.lang: fr<br />form.fr: part","dimension1:  0.2645024028<br />dimension2:  0.4042137810<br />ID_occurrence: 285<br />La haute tour de l' hôtel de ville , où veillent les guetteurs , dominait tout cet ensemble de rues et d' avenues , se ** coupant ** à angles droits ulaire et orientale , steamer en fer à hélice et à spardeck , ** jaugeant ** deux mille huit cents tonnes et possédant une force nominale de cinq cents chevaux .<br />src.lang: fr<br />form.fr: part","dimension1:  0.2197712903<br />dimension2:  0.4411141671<br />ID_occurrence: 441<br />Phileas Fogg , la jeune femme , Fix et Passepartout , confortablement assis , regardaient le paysage varié qui passait sous leurs yeux , - vastes prairies , montagnes se ** profilant ** à l' horizon , creeks roulant leurs eaux écumeuses .<br />src.lang: fr<br />form.fr: part","dimension1: -0.2137114016<br />dimension2:  0.2927852297<br />ID_occurrence: 447<br />En d' autres termes , pendant que Phileas Fogg , ** marchant ** vers l' est , voyait le soleil passer quatre-vingts fois au méridien , ses collègues restés à Londres ne le voyaient passer que soixante-dix-neuf fois .<br />src.lang: fr<br />form.fr: part","dimension1:  0.1240539362<br />dimension2:  0.1894172281<br />ID_occurrence: 449<br />L' agent passa là quelques heures difficiles , tantôt ** croyant ** tout perdu , tantôt espérant que Fogg ignorait la situation , enfin ne sachant quel parti prendre .<br />src.lang: fr<br />form.fr: part","dimension1: -0.2383728931<br />dimension2:  0.2511077798<br />ID_occurrence: 451<br />mais les ingénieurs , ainsi qu' il a été dit , n' ont pas violenté la nature , ils ont rusé avec elle , ** tournant ** les difficultés , et pour atteindre le grand bassin , un seul tunnel , long de quatorze mille pieds , a été percé dans tout le parcours du rail-road .<br />src.lang: fr<br />form.fr: part","dimension1:  0.1304485669<br />dimension2:  0.2020484311<br />ID_occurrence: 458<br /> Attendu \" , reprit le juge , \" attendu que la loi anglaise entend protéger également et rigoureusement toutes les religions des populations de l' Inde , le délit ** étant ** avoué par le sieur Passepartout , convaincu d' avoir violé d' un pied sacrilège le pavé de la pagode de Malebar-Hill , à Bombay , dans la jour  entrer .<br />src.lang: it<br />form.fr: ger","dimension1: -0.3141693848<br />dimension2: -0.0292710684<br />ID_occurrence:  89<br />Et qui versait mal , qui buvait bien , qui mourait en ** riant ** et qui riait en mourant , qui trimbalait son flacon et qui buvait dans le verre des autres .<br />src.lang: it<br />form.fr: ger","dimension1: -0.1537048326<br />dimension2: -0.3540568426<br />ID_occurrence: 111<br />Guillaume aussi devait avoir eu une expérience semblable à la mienne , car il se touchait la joue , en levant bien haut la lampe et en ** regardant ** tout autour de lui .<br />src.lang: it<br />form.fr: ger","dimension1: -0.3124322479<br />dimension2: -0.0972063029<br />ID_occurrence: 118<br />Mais comme je lui dis que ces seigneurs souhaitaient vivement découvrir « le tartoufo » , comme on nomme la truffe là-bas , sous la terre pour le manger ensuite , il comprit que l’ objet de leur recherche gourmande était « der Teufel » , autrement dit le diable , et il se signa avec dévotion en me ** regardant ** tout ahuri .<br />src.lang: it<br />form.fr: ger","dimension1: -0.4331544188<br />dimension2:  0.0223947813<br />ID_occurrence: 137<br />— En ** soutenant ** qu’ on ne doit pas recevoir de sacrements des mains de prêtres impurs …<br />src.lang: it<br />form.fr: ger","dimension1: -0.3473493963<br />dimension2:  0.0001385258<br />ID_occurrence: 158<br />En le ** gardant ** secret , il gardait au contraire intacts son prestige et sa force , il n’ était pas corrompu par la dispute , par la suffisance quodlibétique qui veut passer au crible du sic et non chaque mystère et chaque grandeur .<br />src.lang: it<br />form.fr: ger","dimension1: -0.2987083067<br />dimension2: -0.0935242040<br />ID_occurrence: 200<br />J’ ai l’ impression , en ** lisant ** cette page , d’ avoir déjà lu certains de ces mots , et des phrases presque identiques , que j’ ai vues ailleurs , me reviennent à l’ esprit .<br />src.lang: it<br />form.fr: ger","dimension1: -0.2571524690<br />dimension2: -0.1112498497<br />ID_occurrence: 215<br />Elles vivaient dans l’ humilité en ** reconnaissant ** le pouvoir de l’ Église , elles ne s’ arrogèrent jamais le don de la prophétie !<br />src.lang: it<br />form.fr: ger","dimension1: -0.3967529945<br />dimension2: -0.0155154442<br />ID_occurrence: 255<br />J’ ignorais l’ existence de beaucoup d’ entre eux , j’ en reconnus d’ autres : par exemple les Brutiens avec six doigts à chaque main , les Fauniens qui naissent des vers qui se forment entre l’ écorce et l’ aubier des arbres , les Sirènes avec leur queue écailleuse , qui séduisent les marins , les Ethiopiens au corps tout noir , qui se défendent des flammes du soleil en ** creusant ** des cavernes souterraines , les Onacentaures , hommes jusqu’ au nombril et ânes en dessous , les Cyclopes avec un œil unique de la largeur d’ un écu , Scylla avec sa tête et sa poitrine de fille , son ventre de loup et sa queue de dauphin , les hommes velus de l’ Inde qui vivent dans les marais et sur le fleuve Epigmaride , les Cynocéphales , qui ne peuvent dire un mot sans s’ interrompre et aboyer , les Sciapodes , qui courent à folle allure sur leur unique jambe et quand ils veulent se protéger du soleil , s’ allongent et dressent leur grand pied comme une ombrelle , les Astomates de la Grèce , sans bouche , qui respirent par leurs narines et ne vivent que d’ air , les femmes barbues d’ Arménie , les Pygmées , les Epistiges que certains appellent aussi Blemmes , qui naissent sans tête , ont la bouche sur le ventre et les yeux sur les épaules , les femmes monstrueuses de la mer Rouge , de douze pieds de haut , avec des cheveux qui leur arrivent aux talons , une queue bovine au bas du dos et des sabots de chameau , et puis ceux qui ont la plante des pieds dirigée vers l’ arrière , tant et si bien qu’ à les suivre à la trace , on arrive toujours d’ où ils viennent et jamais où ils vont , et encore ceux dont les yeux brillent comme des lampes et les monstres de l’ île de Circé , corps humains et cols des animaux les plus variés …<br />src.lang: it<br />form.fr: ger","dimension1: -0.3124322479<br />dimension2: -0.0972063029<br />ID_occurrence: 278<br />— Oh arrogance ! s’ écria Bernard en ** frappant ** du poing sur la table .<br />src.lang: it<br />form.fr: ger","dimension1: -0.2064507979<br />dimension2: -0.2319750434<br />ID_occurrence: 318<br />Quelquefois , comme il advint à l’ abbaye , il déambulait toute la journée dans le potager , examinant les plantes comme si c’ étaient des chrysoprases ou des émeraudes , et je le vis rôder dans la crypte du trésor en ** regardant ** un écrin constellé d’ émeraudes et de chrysoprases comme si c’ était un buisson de stramoine .<br />src.lang: it<br />form.fr: ger","dimension1: -0.2177463099<br />dimension2: -0.1348100633<br />ID_occurrence: 326<br />Partant , il avait résolu de laisser les choses telles quelles , en ** attendant ** que quelqu’un découvrît le corps au petit matin , après l’ ouverture des portes .<br />src.lang: it<br />form.fr: ger","dimension1: -0.1628315338<br />dimension2: -0.2526763193<br />ID_occurrence: 358<br />Guillaume m’ entraîna brutalement hors du narthex en me ** faisant ** courir vers l’ hôpital :<br />src.lang: it<br />form.fr: ger","dimension1: -0.3470248991<br />dimension2: -0.1616800020<br />ID_occurrence: 373<br />Or si Dieu a confié à notre ordre une mission , c’ est celle de s’ opposer à cette course vers l’ abîme , et en ** conservant ** , en répétant et en défendant le trésor de sagesse que nos pères nous ont confié .<br />src.lang: it<br />form.fr: ger","dimension1: -0.3124322479<br />dimension2: -0.0972063029<br />ID_occurrence: 391<br />Et ne regarde plus le portail , dit-il en me ** donnant ** une légère tape sur la nuque alors que je me retournais , aimanté par les sculptures que j’ avais vues à l’ entrée .<br />src.lang: it<br />form.fr: ger"],"type":"scatter","mode":"markers","marker":{"autocolorscale":false,"color":"rgba(0,176,246,1)","opacity":0.5,"size":15.118110236220474,"symbol":"triangle-up","line":{"width":1.8897637795275593,"color":"rgba(0,176,246,1)"}},"hoveron":"points","name":"(it,ger)","legendgroup":"(it,ger)","showlegend":true,"xaxis":"x","yaxis":"y","hoverinfo":"text","frame":null},{"x":[0.42133865500772999,-0.071396137324707898,-0.11307182034481854,-0.06610666455089681,0.42607735975797678,0.18180172074966261,-0.11442863702282866,0.50683377821545461,-0.033643669836016174,0.17939180310275643,-0.17597990723422557],"y":[-0.10706247810240475,0.27481310773373957,0.15437243720820071,0.18802965220340778,-0.080329010997458192,0.3979660622529852,0.15325714309751429,-0.13130122072466371,0.35006426320991441,0.32234426458193044,0.29427574183472432],"text":["dimension1:  0.4194440660<br />dimension2: -0.1076965196<br />ID_occurrence:  43<br />C’ est dans cette bonne disposition d’ esprit que me vit mon maître quand , entraîné par mes pas et sans m’ en rendre compte , ** ayant ** presque accompli un périple autour de l’ abbaye , je me retrouvai où nous nous étions quittés deux heures auparavant .<br />src.lang: it<br />form.fr: part","dimension1: -0.0662070012<br />dimension2:  0.2757735452<br />ID_occurrence: 103<br />Guillaume se rendit compte de ce qui arrivait et il lâcha prise – le vieux , se ** sentant ** libre , recula de quelques pas – hésita sensiblement , trop sans doute , incertain s’ il fallait reprendre Jorge ou se précipiter pour éteindre le petit bûcher .<br />src.lang: it<br />form.fr: part","dimension1: -0.1038076991<br />dimension2:  0.1543091776<br />ID_occurrence: 126<br />À ce point -là , Bence , ** redoutant ** d’ être découvert , s’ en était retourné au dortoir .<br />src.lang: it<br />form.fr: part","dimension1: -0.0795872526<br />dimension2:  0.1880050675<br />ID_occurrence: 132<br />La querelle faisait encore rage , lorsque l’ un des novices de garde à la porte entra , ** passant ** au milieu de cette confusion comme qui traverse un champ battu par la grêle , et vint glisser à l’ oreille de Guillaume que Séverin désirait lui parler d’ urgence .<br />src.lang: it<br />form.fr: part","dimension1:  0.4385704507<br />dimension2: -0.0794285525<br />ID_occurrence: 167<br />J’ étais fasciné par ces cartilages jaunis , mystiques et répugnants à la fois , transparents et mystérieux , par ces lambeaux de vêtements d’ époque immémoriale , décolorés , effilochés , parfois enroulés dans une fiole comme un manuscrit défraîchi , par ces matières en miettes se confondant avec l’ étoffe qui leur servait de couche , saints détritus d’ une vie jadis animale ( et rationnelle ) et maintenant , prisonniers des édifices de cristal ou de métal qui mimaient dans leur minuscule dimension la hardiesse des cathédrales de pierre avec leurs tours et leurs flèches , ** semblant ** transformés eux aussi en substance minérale .<br />src.lang: it<br />form.fr: part","dimension1:  0.1724348882<br />dimension2:  0.3981339397<br />ID_occurrence: 190<br />Mais cette mienne inaptitude à voir est sans doute l’ effet de l’ ombre que la grande ténèbre ** approchant ** projette sur le monde vieilli .<br />src.lang: it<br />form.fr: part","dimension1: -0.1045225916<br />dimension2:  0.1526174565<br />ID_occurrence: 241<br />Les rochers sont au contraire précisément à l’ endroit où la muraille finit , ** formant ** comme une sorte de marche , et après commence la chute des litières .<br />src.lang: it<br />form.fr: part","dimension1:  0.4905345986<br />dimension2: -0.1309252272<br />ID_occurrence: 301<br />Mais souvent , une liste de titres dit fort peu , seul le bibliothécaire ** sachant ** d’ après l’ emplacement du volume , d’ après le degré de son inaccessibilité , quel type de secrets , de vérités ou de mensonges le volume recèle .<br />src.lang: it<br />form.fr: part","dimension1: -0.0432061121<br />dimension2:  0.3494360868<br />ID_occurrence: 332<br />Arrivé au terme de ma vie de pécheur , tandis que chenu , vieilli comme le monde , dans l’ attente de me perdre en l’ abime sans fond de la divinité silencieuse et déserte , ** participant ** de la lumière immuable des intelligences angéliques , désormais retenu par mon corps lourd et malade dans cette cellule de mon cher monastère de Melk , je m’ apprête à laisser sur ce vélin témoignage des événements admirables et terribles auxquels dans ma jeunesse il me fut donné d’ assister , en répétant verbatim tout ce que je vis et entendis , sans me hasarder à en tirer un dessein , comme pour laisser à ceux qui viendront ( si l’ Antéchrist ne les devance ) des signes de signes , afin que sur eux s’ exerce la prière du déchiffrement .<br />src.lang: it<br />form.fr: part","dimension1:  0.1987278472<br />dimension2:  0.3230932796<br />ID_occurrence: 385<br />Célestin V fut remplacé par Boniface VII , et ce Pape se hâta de manifester une très faible indulgence pour spirituels et fraticelles en général : tout juste dans les dernières années du siècle ** touchant ** à sa fin , il signa une bulle , Firma cautela , dans laquelle il condamnait en vrac bizoches , quêteurs errants qui gravitaient à la limite extrême de l’ ordre franciscain , et les spirituels mêmes , autrement dit ceux qui se retranchaient de la vie de l’ ordre pour s’ adonner à la vie érémitique .<br />src.lang: it<br />form.fr: part","dimension1: -0.1921404582<br />dimension2:  0.2934006291<br />ID_occurrence: 397<br />Et Rémigio avait toujours porté ces lettres sur lui , sans oser les remettre à leurs destinataires , et à son arrivée à l’ abbaye , craignant de les garder encore par-devers lui , mais ne ** voulant ** pas les détruire , il les avait remises au bibliothécaire , oui à Malachie précisément , pour qu’ il les cachât quelque part dans un recoin de l’ Édifice .<br />src.lang: it<br />form.fr: part"],"type":"scatter","mode":"markers","marker":{"autocolorscale":false,"color":"rgba(0,176,246,1)","opacity":0.5,"size":15.118110236220474,"symbol":"square","line":{"width":1.8897637795275593,"color":"rgba(0,176,246,1)"}},"hoveron":"points","name":"(i nt ** d’ inscrire l’ étranger à titre provisoire , cependant que lui-même , Likhodieïev , s’ en irait à Yalta .<br />src.lang: ru<br />form.fr: ger","dimension1: -0.4633356552<br />dimension2: -0.0071983606<br />ID_occurrence: 486<br />Une aile de cavalerie déboucha au grand trot sur la place , pour la couper de biais en ** évitant ** l’ attroupement de peuple , afin de gagner , par la ruelle qui longeait une partie du mur d’ enceinte couverte de vigne vierge , le mont Chauve au plus court .<br />src.lang: ru<br />form.fr: ger"],"type":"scatter","mode":"markers","marker":{"autocolorscale":false,"color":"rgba(231,107,243,1)","opacity":0.5,"size":15.118110236220474,"symbol":"triangle-up","line":{"width":1.8897637795275593,"color":"rgba(231,107,243,1)"}},"hoveron":"points","name":"(ru,ger)","legendgroup":"(ru,ger)","showlegend":true,"xaxis":"x","yaxis":"y","hoverinfo":"text","frame":null},{"x":[0.15065666882134324,-0.11667622122917862,0.14208508708393916,-0.15160530482150975,-0.050982260136792315,0.018073204596108679,-0.073750997854064915,0.31893801043363623,0.36734164471553299,0.12067127775955114,-0.20034467863014727,-0.099610114628491703,0.2133615450968519,0.23309423450204142,-0.0095281165236617404,0.066602793780186909,-0.10330374957066567],"y":[0.42375335433942307,0.15425374292699517,0.05186196945936198,0.26848818939120944,0.12592375788771051,0.022992015545834237,0.34760821093626343,0.0063607009989992335,-0.04772278510089914,0.054991452746008022,0.29327298939141444,0.15406285210955786,0.056541919815646449,0.45115483035448212,0.20350243064452822,0.24306202102005761,0.15489686718188125],"text":["dimension1:  0.1415498194<br />dimension2:  0.4237373840<br />ID_occurrence:  50<br />Avec révérence et rond de jambe , le chat , de ses pattes de devant , imita les gestes d’ un portier ** ouvrant ** à deux battants une large porte .<br />src.lang: ru<br />form.fr: part","dimension1: -0.1038076991<br />dimension2:  0.1543091776<br />ID_occurrence:  62<br />Elle demeura là prè
