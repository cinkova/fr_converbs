rop rapide pour pouvoir frapper à coups redoublés ; ** glissant ** alors sur le côté , il recourait à un expédient qui lui semblait à la fois un aveu d' échec et une virtuosité technique digne d' un brevet : enfonçant profondément la main dans son ventre , il effectuait avec les doigts de puissants mouvements de bas en haut ; un geyser jaillissait , c' était une inondation , elle l' embrassait et le couvrait de mots doux .","dimension1: -0.1477125640<br />dimension2: -0.1726677047<br />ID_occurrence:  10<br />- Messire , je suis consterné! vociféra le chat en ** donnant ** à sa gueule un air de consternation .","dimension1:  0.2085721876<br />dimension2: -0.0024095139<br />ID_occurrence:  11<br />Passepartout , éclairé par cette révélation , ** devant ** craindre d' être compromis , se rangerait sans doute à lui , Fix .","dimension1:  0.4197726018<br />dimension2: -0.0993458255<br />ID_occurrence:  13<br />Le nègre montra de superbes dents blanches , et Laura ** tirant ** du panier un bouquet de cinq œillets à demi fanés le tendit à Paul :","dimension1:  0.0903445622<br />dimension2:  0.2626539894<br />ID_occurrence:  14<br />Oui , tel est bien le mot que vous prononcez le plus souvent , ** écoutant ** cette affaire ou d' autres pareilles .","dimension1:  0.2273197816<br />dimension2:  0.4544987016<br />ID_occurrence:  15<br />Kennedy ** riant ** devant l' objectif d' un photographe ne réagit nullement à une situation comique , mais ouvre très consciemment la bouche et découvre les dents .","dimension1: -0.3154450179<br />dimension2: -0.0477551367<br />ID_occurrence:  16<br />En effet , en arrivant et en ** admettant ** que le sieur Fogg n' en jetât pas encore quelques poignées à la mer , plus de sept mille livres ( 175 000 F ) manqueraient au sac à bank-notes !","dimension1: -0.3241490604<br />dimension2: -0.0409672781<br />ID_occurrence:  17<br />Métamorphoser sa cellule en une scène et rendre son sort supportable en l' ** exposant ** , en l' exhibant .","dimension1: -0.1477125640<br />dimension2: -0.1726677047<br />ID_occurrence:  19<br />« Tu ne comprends rien , dit Marie-Anne , en ** essayant ** , sans se lever , de taper sur le ventre de son père , l' interprète principal est tellement beau .","dimension1:  0.1336693453<br />dimension2:  0.4587180934<br />ID_occurrence:  20<br />Elle avait une image devant les yeux : un lièvre ** détalant ** dans un sillon , un garde-chasse au feutre vert et le clocher d' une église au-dessus de la forêt .","dimension1:  0.2602229821<br />dimension2: -0.4576896358<br />ID_occurrence:  21<br />En se ** tournant ** successivement vers tous ses visages reflétés , il dit d' une voix faible et suraiguë de vieille dame :","dimension1: -0.3981450610<br />dimension2: -0.0252390727<br />ID_occurrence:  24<br /> Monsieur Fix à bord ! \" répondit Passepartout , absolument surpris , en ** reconnaissant ** son compagnon de traversée du Mongolia .","dimension1:  0.3056371946<br />dimension2: -0.0452413504<br />ID_occurrence:  25<br />N' était -ce pas plutôt la réaction hystérique d' un homme qui , ** comprenant ** en son for intérieur son inaptitude à l' amour , commençait à se jouer à lui-même la comédie de l' amour ?","dimension1:  0.1562475727<br />dimension2:  0.2023408377<br />ID_occurrence:  26<br />Elle n' avait pas pu y rester , son mari ** étant ** à la recherche d' un emploi urbain .","dimension1: -0.2590676774<br />dimension2: -0.0753631521<br />ID_occurrence:  29<br />Elle le regardait en ** souriant ** , comme si elle savait qu' il allait venir .","dimension1:  0.2555980601<br />dimension2:  0.3935372428<br />ID_occurrence:  32<br />Ainsi , lors des arrivées de Lucie au grillage , je n' étais pas seul à l' observer , mais avec moi une bonne dizaine de copains ** sachant ** avec exactitude comment Lucie aimait , ce qu' alors elle disait ou comme elle soupirait , et chaque fois ils constataient d' un air entendu qu' elle était encore chaussée des escarpins noirs , et ils l' imaginaient nue , se promenant sur ces échasses d' un coin à l' autre de la petite chambre .","dimension1:  0.1372041662<br />dimension2:  0.2684386107<br />ID_occurrence:  33<br />Accablé d' un terrible regret , je caressai sa tête dégarnie , ses longs cheveux fins qui tentaient tristement de couvrir sa calvitie , et je constatai avec frayeur que ce voyage dans ma ville natale où j' avais voulu atteindre le Zemanek haï m' amenait , pour finir , à porter dans mes bras mon copain terrassé ( oui , je me voyais à cet instant , le ** tenant ** sur mes bras , le tenant et le portant , immense et lourd , comme si j' avais porté ma propre faute obscure , je me voyais l' emportant à travers une foule , je me voyais en pleurs ) .","dimension1: -0.2465588187<br />dimension2: -0.0072959073<br />ID_occurrence:  34<br />Il y avait là-dedans des phrases sur l' amour de l' Union soviétique et sur la fidélité au parti communiste , il y avait une condamnation des intellectuels qui , était -il écrit , voulaient conduire le pays à la guerre civile , mais surtout , il y avait une dénonciation de la rédaction de l' hebdomadaire des écrivains avec le nom du journaliste à la haute silhouette voûtée ( Tomas ne l' avait jamais rencontré mais connaissait son nom et sa photo ) qui l' avait délibérément abusé en ** déformant ** le sens de son article pour en faire un appel contre-révolutionnaire ;","dimension1: -0.3916205632<br />dimension2: -0.0103562858<br />ID_occurrence:  35<br />Si K. , épuisé de discours , faisait parfois remarquer que l’ affaire n’ avançait guère , même en ** tenant ** compte de toutes les difficultés , on lui répondait qu’ elle allait fort bien son petit chemin , mais qu’ elle en serait évidemment beaucoup plus loin si on s’ était adressé à temps à l’ avocat .","dimension1:  0.0233957216<br />dimension2:  0.2542259346<br />ID_occurrence:  36<br />Ces vers ont tous un nombre de syllabes différent , les trochées , les iambes , les dactyles alternent , le sixième vers est étrangement plus long que les autres ; et bien que le poème se compose de deux quatrains , la première phrase grammaticale se termine asymétriquement dans le cinquième vers , ** créant ** une mélodie qui n' existe nulle part ailleurs que dans ce seul et unique poème , aussi superbe que parfaitement ordinaire .","dimension1: -0.1649270315<br />dimension2: -0.2323149915<br />ID_occurrence:  38<br />Il a le verbe haut , il plaisante en ** levant ** tour à tour chaque genou , pour bien convaincre les deux sœurs de son enjouement de tonton , toujours prêt à se transformer en cheval de course pour le plaisir de ses petites nièces .","dimension1:  0.0779990691<br />dimension2:  0.4166810768<br />ID_occurrence:  39<br />À propos du rapport entre idéologie et imagolo-gie , j' ajoute encore ceci : les idéologies étaient comme d' immenses roues , ** tournant ** en coulisse et déclenchant les guerres , les révolutions , les réformes .","dimension1: -0.3124322479<br />dimension2: -0.0972063029<br />ID_occurrence:  41<br />- J’ aidais les pompiers , messire , répondit Koroviev en ** montrant ** son pantalon déchiré .","dimension1:  0.4194440660<br />dimension2: -0.1076965196<br />ID_occurrence:  43<br />C’ est dans cette bonne disposition d’ esprit que me vit mon maître quand , entraîné par mes pas et sans m’ en rendre compte , ** ayant ** presque accompli un périple autour de l’ abbaye , je me retrouvai où nous nous étions quittés deux heures auparavant .","dimension1: -0.4013990717<br />dimension2: -0.0741390336<br />ID_occurrence:  44<br />La larme dans l' œil de Laura était celle de l' émotion que suscitait chez Laura la vue d' une Laura décidée à faire le sacrifice de sa vie , en ** restant ** aux côtés du mari de sa sœur disparue .","dimension1:  0.1284969104<br />dimension2: -0.0207528314<br />ID_occurrence:  45<br />Une heure après avoir quitté Bombay , le train , ** franchissant ** les viaducs , avait traversé l' île Salcette et courait sur le continent .","dimension1:  0.2734844308<br  vrai … quand mon maître serait le voleur que vous cherchez … ce que je nie … j' ai été … je suis à son service … je l' ai vu bon et généreux . \"\"","dimension1: -0.1518193756<br />dimension2: -0.1512564385<br />ID_occurrence: 438<br />Comme en ** passant ** , il m' avait appelé ami et j' étais sûr que la réconciliation humiliante n' était plus qu' à deux pas ;","dimension1: -0.0505077003<br />dimension2: -0.3497481303<br />ID_occurrence: 439<br />Tout en se ** reprochant ** d' avoir cédé , Grizzly savait qu' aucun autre choix n' était possible .","dimension1:  0.2310797089<br />dimension2:  0.1137767188<br />ID_occurrence: 440<br />Mais K. , ** redoutant ** que celui-ci ne vînt à disparaître , aurait voulu rendre l’ autre dix fois plus prompt .","dimension1:  0.2197712903<br />dimension2:  0.4411141671<br />ID_occurrence: 441<br />Phileas Fogg , la jeune femme , Fix et Passepartout , confortablement assis , regardaient le paysage varié qui passait sous leurs yeux , - vastes prairies , montagnes se ** profilant ** à l' horizon , creeks roulant leurs eaux écumeuses .","dimension1:  0.4399262215<br />dimension2: -0.1117412386<br />ID_occurrence: 442<br />Je n' avais pas , alors , beaucoup de chagrins intimes , au contraire , j' avais un considérable sens de la plaisanterie et pourtant on ne peut pas dire que j' ai pleinement réussi au regard joyeux de l' époque : mes blagues manquaient par trop de sérieux , tandis que la joie contemporaine ne souffrait pas les facéties ou l' ironie , ** étant ** , je le répète , une joie grave qui s' intitulait fièrement « l' optimisme historique de la classe victorieuse » , une joie ascétique et solennelle , en un mot la Joie .","dimension1: -0.2481340486<br />dimension2: -0.0642858279<br />ID_occurrence: 443<br /> Je ne sais , mon officier \" , répondit le Parsi , en ** prêtant ** l' oreille à un murmure confus qui passais sous l' épaisse ramure .","dimension1: -0.3911158625<br />dimension2:  0.0346532918<br />ID_occurrence: 444<br /> Moi , monsieur Fogg ! … \" répondit Mrs . Aouda , en ** comprimant ** les battements de son coeur .","dimension1:  0.2734844308<br />dimension2: -0.5072322455<br />ID_occurrence: 446<br />« Je peux déjà marcher » , dit-il en se ** levant ** gauchement , ankylosé qu’ il était par sa longue station assise .","dimension1: -0.2137114016<br />dimension2:  0.2927852297<br />ID_occurrence: 447<br />En d' autres termes , pendant que Phileas Fogg , ** marchant ** vers l' est , voyait le soleil passer quatre-vingts fois au méridien , ses collègues restés à Londres ne le voyaient passer que soixante-dix-neuf fois .","dimension1:  0.0406666812<br />dimension2: -0.3494904975<br />ID_occurrence: 448<br />Beaucoup de ses photos parurent à l' étranger dans les journaux les plus divers : on y voyait des tanks , des poings menaçants , des immeubles détruits , des morts recouverts d' un drapeau tricolore ensanglanté , des jeunes gens à moto qui tournaient à toute vitesse autour des chars en agitant des drapeaux tchèques au bout de longues perches , et de très jeunes filles vêtues de minijupes incroyablement courtes , qui provoquaient les malheureux soldats russes sexuellement affamés en ** embrassant ** sous leurs yeux des passants inconnus .","dimension1:  0.1240539362<br />dimension2:  0.1894172281<br />ID_occurrence: 449<br />L' agent passa là quelques heures difficiles , tantôt ** croyant ** tout perdu , tantôt espérant que Fogg ignorait la situation , enfin ne sachant quel parti prendre .","dimension1:  0.5130465786<br />dimension2: -0.2158418148<br />ID_occurrence: 450<br />NA","dimension1: -0.2383728931<br />dimension2:  0.2511077798<br />ID_occurrence: 451<br />mais les ingénieurs , ainsi qu' il a été dit , n' ont pas violenté la nature , ils ont rusé avec elle , ** tournant ** les difficultés , et pour atteindre le grand bassin , un seul tunnel , long de quatorze mille pieds , a été percé dans tout le parcours du rail-road .","dimension1:  0.2322340813<br />dimension2: -0.5117704835<br />ID_occurrence: 452<br />L' unanimité se fit d' ailleurs sur cette dernière idée , que le chœur des enfants reprit à l' unisson en s' ** avançant ** , bras tendu et bouquet au bout .","dimension1: -0.1557975377<br />dimension2: -0.2147460761<br />ID_occurrence: 453<br />Son front ne s' assombrit pas un instant , et , cependant , un retard de vingt heures pouvait compromettre son voyage en lui ** faisant ** manquer le départ du paquebot de Yokohama .","dimension1: -0.2997047876<br />dimension2: -0.0739626338<br />ID_occurrence: 455<br />Le président américain Jimmy Carter m' a toujours été sympathique , mais c' est presque de l' amour que j' ai éprouvé pour lui en le ** voyant ** , sur l' écran de télévision , courir en survêtement avec un groupe de collaborateurs , d' entraîneurs et de gorilles ; soudain la sueur perla à son front , son visage se crispa , ses collaborateurs se penchèrent sur lui , le saisirent à bras-le-corps : une petite crise cardiaque .","dimension1: -0.0406593472<br />dimension2: -0.2990434943<br />ID_occurrence: 457<br />Joseph ! s’ écria l’ oncle en ** cherchant ** à se dégager pour pouvoir s’ arrêter – mais K. ne le lâcha pas – Joseph , on t’ a changé , je t’ avais toujours connu un jugement sûr et voilà que la tête t’ abandonne ;","dimension1:  0.1304485669<br />dimension2:  0.2020484311<br />ID_occurrence: 458<br /> Attendu \" , reprit le juge , \" attendu que la loi anglaise entend protéger également et rigoureusement toutes les religions des populations de l' Inde , le délit ** étant ** avoué par le sieur Passepartout , convaincu d' avoir violé d' un pied sacrilège le pavé de la pagode de Malebar-Hill , à Bombay , dans la journée du 20 octobre , condamne ledit Passepartout à quinze jours de prison et à une amende de trois cents livres ( 7 500 F ) . \"\"","dimension1: -0.4237887065<br />dimension2: -0.0513254329<br />ID_occurrence: 459<br />Essayons de répondre en nous ** rappelant ** cette jeune femme du sauna qui , avec combativité , affirmait sa prédilection pour les douches froides .","dimension1: -0.0452204645<br />dimension2:  0.3512452838<br />ID_occurrence: 461<br />Puis , se ** tournant ** vers ses collègues :","dimension1:  0.0463416909<br />dimension2:  0.3165679485<br />ID_occurrence: 462<br />On sentait , pour ainsi dire , que le train tout entier , ** marchant ** avec une rapidité de cent milles à l' heure , ne pesait plus sur les rails .","dimension1:  0.3125028256<br />dimension2:  0.0790269817<br />ID_occurrence: 463<br />Se ** hâtant ** de déglutir ( car il n' est pas bon d' être photographié quand on a le visage déformé par la mastication , vu la méchanceté des photographes qui raffolent de ce genre de portraits ) , il lance d' une voix forte pour être entendu de tous :","dimension1:  0.1763961542<br />dimension2:  0.2160059685<br />ID_occurrence: 465<br />Et Mr. Fogg , ** offrant ** son bras à Mrs . Aouda , se dirigea vers les docks à la recherche d' un navire en partance .","dimension1: -0.1448459765<br />dimension2: -0.0858141122<br />ID_occurrence: 466<br />En s' ** approchant ** du lit , Paul vit le corps recouvert d' un drap jusqu' au-dessus de la tête .","dimension1:  0.2823913516<br />dimension2:  0.2554706468<br />ID_occurrence: 467<br />Là , il avait enfin trouvé le mandat , qui , ** courant ** après lui depuis Bombay , avait déjà quarante jours de date , - mandat qui lui avait été expédié de Hong-Kong par ce même Carnatic à bord duquel on le croyait .","dimension1: -0.4153583065<br />dimension2:  0.0212396571<br />ID_occurrence: 468<br />« Emballez - les toutes , dit-il en le ** coupant ** au beau milieu de son discours , mon domestique viendra les chercher demain .","dimension1:  0.2334414725<br />dimension2:  0.3605278166<br />ID_occurrence: 469<br />L' événement qui avait attiré tout ce monde devait donc , apparemment , se dérouler au premier , probablement dans le salon dont la porte grande ouverte sur le corridor était obstruée par une foule considérable . Je m' y rendis ; les dimensions de la salle étaient modestes , il y avait environ sept rangées de chaises déjà occupées par des personnes ** ayant ** l' air d' attendre un spectacle .","dimension1: -0.3603026005<br />dimension2: -0.0594426224<br />ID_occurrence: 471<br />- En m' ** invitant ** à votre émission , vous m' avez assuré qu' il s' agirait du film .","dimension1: -0.0494682005<br />dimension2:  0.2415177257<br />ID_occurrence: 472<br />Presque ** pleurant ** , il se rendit dans la pièce où les domestiques travaillaient tranquillement à la polycopie ;","dimension1:  0.0016408673<br />dimension2:  0.2892515244<br />ID_occurrence: 473<br />Tel est l' étrange paradoxe dont sont victimes tous ceux qui recourent à la méthode additive pour cultiver leur moi : ils s' efforcent d' additionner pour créer un moi inimitablement unique , mais ** devenant ** en même temps les propagandistes de ces attributs additionnés , ils font tout pour qu' un maximum de gens leur ressemblent ; et alors l' unicité de leur moi ( si laborieusement conquise ) s' évanouit aussitôt .","dimension1:  0.2640032745<br />dimension2:  0.0419417002<br />ID_occurrence: 474<br />Il dut croire que son voleur , s' ** arrêtant ** à une des stations du Peninsular-railway , s' était réfugié dans les provinces septentrionales .","dimension1: -0.2870761448<br />dimension2: -0.1219287207<br />ID_occurrence: 475<br />Mais préférant éviter ce sujet pour le moment , il répondit en ** rassemblant ** toute sa dignité :","dimension1: -0.3040248792<br />dimension2: -0.1259785865<br />ID_occurrence: 476<br />Enfin , le patron John Bunsby passa au large , et la Tankadère , prenant le vent sous sa brigantine , sa misaine et ses focs , s' élança en ** bondissant ** sur les flots .","dimension1:  0.2038224463<br />dimension2:  0.2492646914<br />ID_occurrence: 479<br /> Et quand passera l' autre train ** venant ** de San Francisco ? \"\"","dimension1: -0.1038076991<br />dimension2:  0.1543091776<br />ID_occurrence: 480<br />Donc Pilate , ** serrant ** machinalement dans sa main l’ agrafe inutile et les yeux mi-clos , monta sur l’ estrade .","dimension1:  0.4246034749<br />dimension2: -0.0680287396<br />ID_occurrence: 481<br />Puis , prenant Passepartout par la ceinture et l' ** enroulant ** de sa trompe , il l' enleva jusqu' à la hauteur de sa tête .","dimension1: -0.3529288484<br />dimension2: -0.0548089427<br />ID_occurrence: 482<br />Je n’ ai pas été très honnête en vous ** parlant ** des allumeurs de réverbères .","dimension1: -0.1189712750<br />dimension2: -0.1398479036<br />ID_occurrence: 485<br /> En ** attendant ** , vous êtes libres sous caution . \"\"","dimension1: -0.4633356552<br />dimension2: -0.0071983606<br />ID_occurrence: 486<br />Une aile de cavalerie déboucha au grand trot sur la place , pour la couper de biais en ** évitant ** l’ attroupement de peuple , afin de gagner , par la ruelle qui longeait une partie du mur d’ enceinte couverte de vigne vierge , le mont Chauve au plus court .","dimension1: -0.0896674996<br />dimension2: -0.1689012870<br />ID_occurrence: 487<br />Tous semblaient porter ces insignes , tous faisaient partie du même clan , ceux de droite comme ceux de gauche , et , en se ** retournant ** brusquement , K. vit aussi les mêmes insignes au col du juge d’ instruction qui , les mains croisées sur le ventre , regardait tranquillement la salle .","dimension1:  0.2857178998<br />dimension2: -0.0973812321<br />ID_occurrence: 489<br />Ils s’ étaient levés en voyant le domestique lui parler , chacun ** cherchant ** une occasion de se faufiler le premier .","dimension1: -0.4293961320<br />dimension2:  0.0242971648<br />ID_occurrence: 491<br /> Un domestique \" , s' écria le Barnum en ** caressant ** l' épaisse barbiche grise qui foisonnait sous son menton , \"\" j' en ai deux , obéissants , fidèles , qui ne m' ont jamais quitté , et qui me servent pour rien , à condition que je les nourrisse . \"\" .. \"\"","dimension1:  0.2001368967<br />dimension2:  0.1730374137<br />ID_occurrence: 492<br />elle ne regardait pas autour d' elle , ne s' agitait nullement , assise comme dans l' attente d' une opération chirurgicale ou de quelque chose par quoi nous sommes tellement captivés qu' ** ignorant ** notre entourage nous concentrons notre attention sur le dedans de nous ;","dimension1:  0.2694580973<br />dimension2: -0.0434920386<br />ID_occurrence: 493<br />« Ça faisait atrocement mal » dit -elle , ** serrant ** les poings comme si ses mains avaient été réellement meurtries .","dimension1:  0.2327757898<br />dimension2:  0.0903495392<br />ID_occurrence: 494<br />Ses six jours de geôle l' avaient à ce point diminué qu' il pouvait à peine parler , qu' il bégayait et cherchait son souffle , ** marquant ** au milieu des phrases des pauses interminables qui duraient près d' une demi-minute .","dimension1: -0.0271618595<br />dimension2:  0.2406094148<br />ID_occurrence: 496<br />plus le climat du jardin était désinvolte et grossier , plus il nous entourait de sa bruyante indifférence , ** faisant ** de nous un îlot délaissé , plus le spleen nous étreignait , et plus nous plongions en nous-mêmes , jouant donc plutôt pour nous que pour les autres , oubliant les autres , la musique étant une enceinte protectrice dans laquelle , parmi les ivrognes tapageurs , nous étions comme dans une cabine de verre suspendue dans les profondeurs des eaux froides .","dimension1: -0.0798656730<br />dimension2: -0.3155399110<br />ID_occurrence: 497<br />Si l'on se rappelle que les intellectuels hongrois se sont donné le nom de « Cercle Petôfi » , quand en 1956 ils se sont dressés contre l' Empire russe en ** déclenchant ** le premier grand soulèvement anti-stalinien , on constate que , par ses amours , Bettina est présente sur le vaste champ de l' histoire européenne , depuis le XVIIIe siècle jusqu' à la moitié du nôtre .","dimension1: -0.2793119613<br />dimension2: -0.1079757509<br />ID_occurrence: 498<br />- Je t’ admire , dit le petit prince , en ** haussant ** un peu les épaules , mais en quoi cela peut -il bien t’ intéresser ? »","dimension1:  0.0902999130<br />dimension2:  0.1780499466<br />ID_occurrence: 499<br />Le vent ** venant ** de terre , la mer était moins forte par là même : circonstance heureuse pour la goélette , car les embarcations d' un petit tonnage souffrent surtout de la houle qui rompt leur vitesse , qui les tue , pour employer l' expression maritime ."],"textfont":{"size":7.559055118110237,"color":"rgba(0,0,0,0.5)"},"type":"scatter","mode":"text","hoveron":"points","showlegend":false,"xaxis":"x","yaxis":"y","hoverinfo":"text","frame":null}],"layout":{"margin":{"t":23.30593607305936,"r":7.3059360730593612,"b":37.260273972602747,"l":48.949771689497723},"plot_bgcolor":"rgba(235,235,235,1)","paper_bgcolor":"rgba(255,255,255,1)","font":{"color":"rgba(0,0,0,1)","family":"","size":14.611872146118724},"xaxis":{"domain":[0,1],"automargin":true,"type":"linear","autorange":false,"range":[-0.76999999999999991,0.76999999999999991],"tickmode":"array","ticktext":["-0.4","0.0","0.4"],"tickvals":[-0.40000000000000002,0,0.40000000000000002],"categoryorder":"array","categoryarray":["-0.4","0.0","0.4"],"nticks":null,"ticks":"outside","tickcolor":"rgba(51,51,51,1)","ticklen":3.6529680365296811,"tickwidth":0.66417600664176002,"showticklabels":true,"tickfont":{"color":"rgba(77,77,77,1)","family":"","size":11.689497716894984},"tickangle":-0,"showline":false,"linecolor":null,"linewidth":0,"showgrid":true,"gridcolor":"rgba(255,255,255,1)","gridwidth":0.66417600664176002,"zeroline":false,"anchor":"y","title":{"text":"dimension1","font":{"color":"rgba(0,0,0,1)","family":"","size":14.611872146118724}},"hoverformat":".2f"},"yaxis":{"domain":[0,1],"automargin":true,"type":"linear","autorange":false,"range":[-0.76999999999999991,0.76999999999999991],"tickmode":"array","ticktext":["-0.4","0.0","0.4"],"tickvals":[-0.40000000000000002,0,0.40000000000000002],"categoryorder":"array","categoryarray":["-0.4","0.0"
